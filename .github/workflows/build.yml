# Сборка EXDPI для Windows и macOS.
#
# Запускается вручную (workflow_dispatch) или по пушу тега вида v*.
# На теге собранные файлы автоматически прикрепляются к релизу:
#   - EXDPI.exe           (Windows x64, DPI + VPN)
#   - EXDPI-macos-arm64.zip (Apple Silicon, только VPN)
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build
        run: pyinstaller build.spec --clean --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXDPI-windows
          path: dist/EXDPI.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/EXDPI.exe --clobber \
            || gh release create "${GITHUB_REF_NAME}" dist/EXDPI.exe \
                 --title "EXDPI ${GITHUB_REF_NAME}" --notes ""

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch sing-box (darwin arm64)
        run: |
          curl -L -o /tmp/singbox.tgz \
            https://github.com/SagerNet/sing-box/releases/download/v1.13.14/sing-box-1.13.14-darwin-arm64.tar.gz
          tar -xzf /tmp/singbox.tgz -C /tmp
          cp /tmp/sing-box-1.13.14-darwin-arm64/sing-box resources/singbox/sing-box
          chmod +x resources/singbox/sing-box

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build
        run: pyinstaller build.spec --clean --noconfirm

      - name: Pack
        run: |
          cd dist
          ditto -c -k --keepParent EXDPI EXDPI-macos-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXDPI-macos
          path: dist/EXDPI-macos-arm64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/EXDPI-macos-arm64.zip --clobber \
            || gh release create "${GITHUB_REF_NAME}" dist/EXDPI-macos-arm64.zip \
                 --title "EXDPI ${GITHUB_REF_NAME}" --notes ""
