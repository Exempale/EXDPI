# Сборка EXDPI для Windows и macOS.
#
# Запускается вручную (workflow_dispatch) или по пушу тега вида v*.
# На теге собранные файлы автоматически прикрепляются к релизу:
#   - EXDPI.exe               (Windows x64, DPI + VPN)
#   - EXDPI-macos-arm64.zip   (Apple Silicon, только VPN)
#   - EXDPI-linux-amd64.zip   (Linux x64, только VPN)
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build
        run: pyinstaller build.spec --clean --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXDPI-windows
          path: dist/EXDPI.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/EXDPI.exe --clobber \
            || gh release create "${GITHUB_REF_NAME}" dist/EXDPI.exe \
                 --title "EXDPI ${GITHUB_REF_NAME}" --notes ""

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch sing-box (darwin arm64)
        run: |
          curl -L -o /tmp/singbox.tgz \
            https://github.com/SagerNet/sing-box/releases/download/v1.13.14/sing-box-1.13.14-darwin-arm64.tar.gz
          tar -xzf /tmp/singbox.tgz -C /tmp
          cp /tmp/sing-box-1.13.14-darwin-arm64/sing-box resources/singbox/sing-box
          chmod +x resources/singbox/sing-box

      - name: Fetch zapret engine (macOS, Flowseal ZapretMac)
        run: |
          curl -L -o /tmp/zapretmac.zip \
            https://github.com/Flowseal/zapret-mac-discord-youtube/releases/download/1.1.2/ZapretMac-macOS-universal.zip
          unzip -o /tmp/zapretmac.zip -d /tmp/zapretmac
          PAYLOAD=/tmp/zapretmac/ZapretMac.app/Contents/Resources/Payload
          mkdir -p resources/zapret-mac
          cp -R "$PAYLOAD/bin" resources/zapret-mac/bin
          cp -R "$PAYLOAD/strategies" resources/zapret-mac/strategies
          cp -R "$PAYLOAD/default-lists" resources/zapret-mac/default-lists
          cp "$PAYLOAD/watchdog.sh" resources/zapret-mac/watchdog.sh
          chmod +x resources/zapret-mac/exdpi-*.sh

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build
        run: pyinstaller build.spec --clean --noconfirm

      - name: Pack
        run: |
          cd dist
          ditto -c -k --keepParent EXDPI EXDPI-macos-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXDPI-macos
          path: dist/EXDPI-macos-arm64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/EXDPI-macos-arm64.zip --clobber \
            || gh release create "${GITHUB_REF_NAME}" dist/EXDPI-macos-arm64.zip \
                 --title "EXDPI ${GITHUB_REF_NAME}" --notes ""

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch sing-box (linux amd64)
        run: |
          curl -L -o /tmp/singbox.tgz \
            https://github.com/SagerNet/sing-box/releases/download/v1.13.14/sing-box-1.13.14-linux-amd64.tar.gz
          tar -xzf /tmp/singbox.tgz -C /tmp
          cp /tmp/sing-box-1.13.14-linux-amd64/sing-box resources/singbox/sing-box
          chmod +x resources/singbox/sing-box

      - name: Build nfqws (zapret, bol-van)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcap-dev libnetfilter-queue-dev libmnl-dev zlib1g-dev
          curl -L -o /tmp/zapret.tar.gz \
            https://github.com/bol-van/zapret/releases/download/v72.13/zapret-v72.13.tar.gz
          tar -xzf /tmp/zapret.tar.gz -C /tmp
          make -C /tmp/zapret-v72.13/nfq
          mkdir -p resources/zapret-linux/bin resources/zapret-linux/strategies resources/zapret-linux/lists
          cp /tmp/zapret-v72.13/nfq/nfqws resources/zapret-linux/nfqws
          cp resources/zapret/bin/*.bin resources/zapret-linux/bin/
          cp resources/zapret/general*.bat resources/zapret-linux/strategies/
          cp -r resources/zapret/lists/. resources/zapret-linux/lists/

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build
        run: pyinstaller build.spec --clean --noconfirm

      - name: Pack
        run: |
          cd dist
          zip -r EXDPI-linux-amd64.zip EXDPI

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXDPI-linux
          path: dist/EXDPI-linux-amd64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/EXDPI-linux-amd64.zip --clobber \
            || gh release create "${GITHUB_REF_NAME}" dist/EXDPI-linux-amd64.zip \
                 --title "EXDPI ${GITHUB_REF_NAME}" --notes ""
